server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip 压缩
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
    gzip_vary on;

    client_max_body_size 2048m;

    # ---------- 后端地址：请求时解析，不在启动时解析 ----------
    # 硬写上游时 nginx 在启动那一刻就要解析 core-server，解析不到直接
    # [emerg] 退出 → 被 restart 策略反复拉起（主机重启后的典型现象）。
    # 变量 + Docker 内嵌 DNS：启动不碰解析，运行中每 10 秒刷新。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend "core-server:8080";

    # 前端路由 history 模式
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API 反向代理
    location /api/ {
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 播放/下载大文件支持
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 媒体文件（服务端中转播放）
    location /media/ {
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # 转码输出（HLS 分片）
    location /transcode/ {
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        add_header Access-Control-Allow-Origin *;
    }
}
