plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// ============ 服务器地址（只是"首次预填建议"）============
// 真正的地址由家长在 App 内填写并存在本地（见 ServerConfig.kt），
// 这里注入的 BuildConfig.SITE_URL 仅作为首次打开时的预填值，
// 所以换个地址**不需要重新打包**。想改预填值用 -PsiteUrl=xxx。
def siteUrl = project.hasProperty('siteUrl') ? project.siteUrl : 'https://study.19860819.xyz:8616'

// ============ 应用名与版本号（产物文件名要用）============
//
// 与 PRO 端同一套规矩（用户 2026-10-16 要求）：
// 产物文件名 = 应用名 + 版本号，例如 `小书童-1.4.0.apk`。
//
// 抽成变量是为了让产物名与包里的 versionName **只有一个来源** ——
// 两处各写一遍，迟早在某次升版本时漏改一处，于是分发给家长的那个包
// 名字写着 1.2.0、装上去是 1.3.0，排查问题时全乱。
def appVersionName = '1.5.1'
def appVersionCode = 10501 // = 10000×1 + 100×5 + 1
// 产物的显示名（不含 .apk）。标配客户端就叫「小书童」，不带后缀。
def appArtifactBase = '小书童'

// ============ release 签名 ============
// 口令放在 android/keystore.properties（**已 gitignore，不要提交**）。
// 文件不存在时 release 照样能构建，只是产出未签名 APK —— 方便别人 clone
// 下来先跑通，不必先自己造一套密钥。
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def hasSigning = keystoreProps.getProperty('storeFile') != null

android {
    namespace 'xyz.littlescholar.kid'
    compileSdk rootProject.ext.compileSdkVer

    defaultConfig {
        applicationId 'xyz.littlescholar.kid'
        minSdk rootProject.ext.minSdkVer
        targetSdk rootProject.ext.targetSdkVer
        // ============ 版本号规矩（用户 2026-10-16 定的）============
        // **每改动一次，版本号升 0.1**（1.1.0 → 1.2.0 → 1.3.0 …）。
        // versionCode = 10000×major + 100×minor + patch，保证单调递增。
        // ⚠️ versionCode 不递增时覆盖安装会直接失败，系统只回一句"应用未安装"。
        versionCode appVersionCode
        // 版本历史（倒序）：
        //   1.5.1  修 1.5.0 的后台播放仍然不响：交接给原生的地址是相对路径
        //         （/api/stream/123?t=…），MediaPlayer 当成文件名 → 接管"成功"但没声。
        //         现在补成绝对地址；另外切后台不再只靠网页 visibilitychange，
        //         壳里 onStop 会按"最近一次在播"的状态主动接管（60s 内有效，
        //         用户自己按过暂停的不接）。
        //   1.5.0  后台播放真的成立：网页进后台前把 url + 位置交给原生，
        //         服务用 MediaPlayer 接着播；回前台交还并 seek 回去。
        //         通知按钮按真实状态给「播放」/「暂停」，不再一律 toggle。
        //         （此前后台靠 evaluateJavascript 驱动网页，WebView 一被挂起
        //          就"通知有图标、点播放没反应、切后台就停"）
        //   1.4.0  系统媒体控制中心：MediaSessionCompat + MediaStyle 前台服务
        //   1.3.0  产物文件名带上「名字 + 版本」
        //   1.2.0  息屏播放保活：前台服务终于被启动了 + WiFi 锁
        //         （此前 MediaPlaybackService 从未被调用，是一段死代码）
        //   1.1.0  升级自愈 + 诊断面板
        versionName appVersionName

        // 注入到 BuildConfig.SITE_URL，供 MainActivity 使用
        buildConfigField 'String', 'SITE_URL', "\"${siteUrl}\""
    }

    signingConfigs {
        if (hasSigning) {
            release {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            debuggable true
            // 与 release 用同一个 applicationId，方便两个包互换安装；
            // 想同时装两个就把下面这行注释打开加上后缀。
            // applicationIdSuffix '.debug'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
            if (hasSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        buildConfig true
        viewBinding false
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/*.kotlin_module', 'META-INF/DEPENDENCIES']
        }
    }
}

// ============ 产物文件名：名字 + 版本（用户 2026-10-16 要求）============
//
// 目标：`小书童-1.3.0.apk`（debug 版是 `小书童-1.3.0-debug.apk`）。
// 理由与 PRO 端同一条：分发给家长的文件夹里不该出现一堆
// `app-release(1).apk`，看名字就得知道这是哪一版。
//
// ⚠️ AGP 8 的 `outputFileName` 是 `Property<String>`，只能 `.set(...)`。
androidComponents {
    onVariants(selector().all()) { variant ->
        def suffix = variant.buildType == 'release' ? '' : "-${variant.buildType}"
        variant.outputs.each { output ->
            output.outputFileName.set("${appArtifactBase}-${appVersionName}${suffix}.apk")
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    // 系统媒体控制中心（MediaSessionCompat + MediaStyle 通知）。
    // 只引 media 不引 media3：我们不需要在这儿解码播放，
    // 播放仍然在 WebView 里，media 包只负责"把状态交给系统"。
    implementation 'androidx.media:media:1.7.0'
    // 扫二维码。选 journeyapps 的 zxing-android-embedded 而不是 ML Kit：
    // 前者自带扫码界面、不依赖 Google Play 服务，包体也小得多 ——
    // 这种"家里用一次"的场景没必要引 ML Kit。
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
