distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# 版本选择依据：AGP 8.5.2（见根 build.gradle）官方要求 Gradle >= 8.7。
# 写成 8.5 会直接失败，报 "Minimum supported Gradle version is 8.7"。
# AGP 8.5.x 的官方支持区间是 8.7 – 8.9，这里取上限。
#
# 走阿里云镜像：国内直连 services.gradle.org 极慢甚至超时。
# 若要改回官方源，替换为：
#   https\://services.gradle.org/distributions/gradle-8.9-bin.zip
distributionUrl=https\://mirrors.aliyun.com/macports/distfiles/gradle/gradle-8.9-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
