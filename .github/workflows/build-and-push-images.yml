name: build-and-push-images

# 说明
# ----
# 为什么镜像在 GitHub 上构建，而不是本地/服务器：
#   1. 开发机（Windows）没装 docker，本地构建不了；
#   2. 服务器是 iStoreOS 软路由，根分区只剩几百 MB，
#      拉 golang + node 两套构建镜像再编译，资源吃紧且慢；
#   3. GitHub runner 有现成的 docker 与 layer cache，构建完直接推 GHCR，
#      服务器只负责 pull + 起容器，职责清晰。
#
# 产物（GHCR）：
#   ghcr.io/<owner>/<repo>/core-server:latest     ← backend/
#   ghcr.io/<owner>/<repo>/frontend:latest        ← frontend-admin/
#   ghcr.io/<owner>/<repo>/frontend-kid:latest    ← frontend-kid/
#
# 包默认是 private。若服务器要免登录拉取，需在包设置里改为 public；
# 否则在服务器上先 `docker login ghcr.io`（用带 read:packages 的 token）。

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend-admin/**"
      - "frontend-kid/**"
      - ".github/workflows/build-and-push-images.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # 先校验两个前端的 nginx 配置，再进入构建。
  #
  # 为什么需要：nginx 只在**启动时**解析配置，语法错误在构建期完全看不出来，
  # 会一路带到生产变成容器的 restart 循环。本项目真实踩过 ——
  # add_header 的值含逗号却没加引号，nginx 把它当成第二个参数：
  #   [emerg] invalid parameter "Content-Length"
  # 结果 ls-kid 容器无限重启。
  nginx-check:
    name: 校验 nginx 配置
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: nginx -t 语法校验
        run: |
          set -e
          for fe in frontend-admin frontend-kid; do
            echo "===== $fe/nginx.conf ====="
            # 配置里的 proxy_pass 指向 compose 服务名 core-server，
            # nginx -t 会去解析这个主机名而失败。所以复制一份并把主机名
            # 临时替换为回环地址，只校验语法与结构，不依赖运行时网络。
            docker run --rm -v "$PWD/$fe:/cfg:ro" nginx:alpine sh -c '
              cp /cfg/nginx.conf /etc/nginx/conf.d/default.conf
              sed -i "s/core-server/127.0.0.1/g" /etc/nginx/conf.d/default.conf
              nginx -t'
          done

  build:
    name: 构建 ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: nginx-check

    permissions:
      contents: read
      packages: write

    strategy:
      # 三个镜像互相独立，一个失败不影响其余，便于一次看清全部结果
      fail-fast: false
      matrix:
        include:
          - image: core-server
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - image: frontend
            context: ./frontend-admin
            dockerfile: ./frontend-admin/Dockerfile
          - image: frontend-kid
            context: ./frontend-kid
            dockerfile: ./frontend-kid/Dockerfile

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送 ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          # latest 用于部署；sha 便于回滚到具体某次提交
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}:latest
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}:${{ github.sha }}
          # GIT_SHA 只被 core-server 的 Dockerfile 用（注入到二进制里，
          # 由 /api/health 与后台「系统状态」读出来，回答"线上是哪一次构建"）；
          # 前端 Dockerfile 不声明这个 ARG，多传一个未声明的 build-arg 是
          # 无害的（Docker 只给一条 warning）。刻意不拆成两套参数：
          # 三行 matrix 里塞条件表达式，比一条多余参数更难维护。
          build-args: |
            VITE_API_BASE=/api
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
