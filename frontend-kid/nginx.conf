server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip 压缩（孩子端资源小，但 PWA 壳与 JS 值得压）
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml
               application/manifest+json;
    gzip_vary on;

    client_max_body_size 2048m;

    # ---------- Service Worker 与 manifest ----------
    # 这两类文件必须禁止缓存，否则 PWA 更新永远拉不到新版本
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
        expires off;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        types { } default_type application/manifest+json;
        expires off;
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache";
        expires off;
    }

    # ---------- 带 hash 的构建产物：长缓存 ----------
    # Vite 产出的 assets/* 文件名带内容 hash，可以放心 immutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---------- 应用图标：短缓存 ----------
    location ~* /(icon|apple-touch-icon|favicon).*\.(png|ico|svg)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # ---------- 前端路由 history 模式 ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- API 反向代理 ----------
    location /api/ {
        proxy_pass http://core-server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 播放/下载大文件支持：关缓冲、长超时
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---------- 媒体中转（音视频流） ----------
    # 关键：透传 Range 请求头，否则 <video> 无法拖进度、无法 seek
    location /media/ {
        proxy_pass http://core-server:8080;
        proxy_set_header Host $host;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # 让 Range 的 206 响应头原样透给浏览器
        proxy_force_ranges on;
    }

    # ---------- 转码输出（HLS 分片） ----------
    location /transcode/ {
        proxy_pass http://core-server:8080;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Headers Range;
        add_header Access-Control-Expose-Headers Content-Range, Content-Length;
        proxy_force_ranges on;
    }
}
